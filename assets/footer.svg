  <text x="600" y="82" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#6B7280">© 2026 Tema · Lilux12 · спасибо, что заглянул</text>
