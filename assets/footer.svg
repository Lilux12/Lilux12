<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" fill="none" role="img" aria-labelledby="footerTitle">
  <title id="footerTitle">root@lilux: exit</title>

  <defs>
    <linearGradient id="footerLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF7A1A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF7A1A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF7A1A" stop-opacity="0"/>
    </linearGradient>
    <style>
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="110" fill="#08070E"/>
  <rect x="0" y="0" width="1200" height="2" fill="url(#footerLine)"/>

  <text x="600" y="50" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#9CA3AF">root@lilux<tspan fill="#FF7A1A">:~$</tspan> <tspan fill="#FFFFFF">exit</tspan></text>
