<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" fill="none" role="img" aria-labelledby="fTitle">
  <title id="fTitle">Спасибо, что заглянул!</title>
  <defs>
    <linearGradient id="fl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF7A1A" stop-opacity="0"/>
      <stop offset="30%" stop-color="#FF7A1A"/>
      <stop offset="70%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <style>
      .bat { animation: bat 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes bat { 0%, 100% { transform: translate(0, 0) scaleY(1); } 25% { transform: translate(10px, -5px) scaleY(.55); } 50% { transform: translate(20px, 0) scaleY(1); } 75% { transform: translate(10px, 5px) scaleY(.55); } }
    </style>
  </defs>
  <rect x="150" y="20" width="900" height="3" rx="1.5" fill="url(#fl)"/>
  <g font-family="'Segoe UI', 'Inter', 'Helvetica Neue', 'Noto Sans', Arial, sans-serif" text-anchor="middle">
    <text x="600" y="68" font-size="22" font-weight="700" fill="#1E293B">Спасибо, что заглянул!</text>
    <text x="600" y="96" font-size="14" fill="#64748B">Понравился проект? Поставь ⭐ — это лучшая мотивация · Тёма, 2026</text>
  </g>
  <path class="bat" d="M378 52c4-6 9-8 13-5 2-4 5-5 7-3 2-2 5-1 7 3 4-3 9-1 13 5-5-2-9-1-11 3-2-2-4-3-6-2-2-1-4 0-6 2-2-4-6-5-11-3z" fill="#FF7A1A"/>
  <path class="bat" style="animation-delay:-3s" d="M790 58c4-6 9-8 13-5 2-4 5-5 7-3 2-2 5-1 7 3 4-3 9-1 13 5-5-2-9-1-11 3-2-2-4-3-6-2-2-1-4 0-6 2-2-4-6-5-11-3z" fill="#38BDF8"/>
</svg>
