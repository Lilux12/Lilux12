<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" fill="none" role="img" aria-labelledby="moreTitle moreDesc">
  <title id="moreTitle">Ещё проекты: TemaOS, TemaPhone, TemaESP</title>
  <desc id="moreDesc">Card with personal hardware and systems projects and a link to all repositories.</desc>

  <defs>
    <linearGradient id="moreLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF8C00" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF8C00" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF8C00" stop-opacity="0"/>
    </linearGradient>
    <style>
      .dot { animation: pulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="494" height="194" rx="8" fill="#0D0D0D" stroke="#2A2A33"/>
  <rect x="40" y="0" width="415" height="2" fill="url(#moreLine)"/>

  <text x="26" y="36" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="2.5" fill="#FF8C00">// HARDWARE &amp; SYSTEMS</text>

  <circle class="dot" cx="30" cy="63" r="3" fill="#FF8C00"/>
  <text x="44" y="68" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#E6EDF3">TemaOS<tspan fill="#8B949E" dx="7">— GUI-ОС для Orange Pi</tspan></text>

  <circle class="dot" cx="30" cy="91" r="3" fill="#FF8C00" style="animation-delay: .5s"/>
  <text x="44" y="96" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#E6EDF3">TemaPhone<tspan fill="#8B949E" dx="7">— телефон с нуля</tspan></text>

  <circle class="dot" cx="30" cy="119" r="3" fill="#FF8C00" style="animation-delay: 1s"/>
  <text x="44" y="124" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#E6EDF3">TemaESP<tspan fill="#8B949E" dx="7">— консоль на ESP32</tspan></text>

  <path d="M26 146H469" stroke="#1F1F26"/>

  <text x="26" y="174" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#C9D1D9">C / C++ / Assembly · личные проекты</text>
  <text x="469" y="174" text-anchor="end" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#FF8C00">все репозитории →</text>
</svg>
