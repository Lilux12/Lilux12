<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none" role="img" aria-labelledby="bTitle bDesc">
  <title id="bTitle">Привет, я Тёма</title>
  <desc id="bDesc">Светлый баннер: «Привет, я Тёма», 13 лет, разработчик и мейкер из России. Справа тыква, месяц и летучие мыши.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF6EC"/>
      <stop offset="55%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EAF6FE"/>
    </linearGradient>
    <linearGradient id="under" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF7A1A"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="pumpkin" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#FFA45C"/>
      <stop offset="100%" stop-color="#F26A0A"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#E2E8F0"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#F26A0A" flood-opacity="0.22"/>
    </filter>
    <style>
      .float { animation: float 5s ease-in-out infinite; }
      .bat { animation: bat 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .wave { animation: wave 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 70% 80%; }
      .twinkle { animation: tw 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes bat { 0%, 100% { transform: translate(0, 0) scaleY(1); } 25% { transform: translate(8px, -6px) scaleY(.55); } 50% { transform: translate(16px, 0) scaleY(1); } 75% { transform: translate(8px, 6px) scaleY(.55); } }
      @keyframes wave { 0%, 60%, 100% { transform: rotate(0); } 15% { transform: rotate(16deg); } 30% { transform: rotate(-8deg); } 45% { transform: rotate(12deg); } }
      @keyframes tw { 0%, 100% { opacity: .3; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.1); } }
    </style>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="24" fill="url(#dots)" opacity="0.7"/>
  <circle cx="120" cy="40" r="150" fill="#FF7A1A" opacity="0.16" filter="url(#blur)"/>
  <circle cx="1080" cy="320" r="170" fill="#38BDF8" opacity="0.22" filter="url(#blur)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="24" stroke="#F3E3D3"/>

  <!-- текст -->
  <g font-family="'Segoe UI', 'Inter', 'Helvetica Neue', 'Noto Sans', Arial, sans-serif">
    <text x="84" y="104" font-size="18" font-weight="700" letter-spacing="5" fill="#FF7A1A">ПРИВЕТ, Я</text>
    <text x="78" y="212" font-size="124" font-weight="800" letter-spacing="-2" fill="#1E293B">Тёма</text>
    <rect x="84" y="232" width="236" height="7" rx="3.5" fill="url(#under)"/>
    <text x="84" y="278" font-size="21" fill="#475569">13 лет · разработчик и мейкер · Россия</text>
  </g>

  <!-- месяц и звёзды -->
  <g class="float">
    <circle cx="1046" cy="92" r="40" fill="#38BDF8"/>
    <circle cx="1066" cy="78" r="36" fill="#FFFFFF"/>
  </g>
  <path class="twinkle" d="M960 58 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4z" fill="#38BDF8"/>
  <path class="twinkle" style="animation-delay:-1.5s" d="M1120 170 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#FF7A1A"/>
  <path class="twinkle" style="animation-delay:-.7s" d="M700 80 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#38BDF8"/>

  <!-- летучие мыши -->
  <g fill="#38BDF8">
    <path class="bat" d="M736 132c5-8 12-10 17-6 2-5 6-6 9-4 3-2 7-1 9 4 5-4 12-2 17 6-6-3-11-1-14 4-2-2-5-4-8-3-3-1-6 1-8 3-3-5-8-7-14-4z"/>
    <path class="bat" style="animation-delay:-2.5s" d="M900 210c4-6 9-8 13-5 2-4 5-5 7-3 2-2 5-1 7 3 4-3 9-1 13 5-5-2-9-1-11 3-2-2-4-3-6-2-2-1-4 0-6 2-2-4-6-5-11-3z" opacity="0.8"/>
    <path class="bat" style="animation-delay:-4.5s" d="M1110 230c3-4 6-5 9-3 1-3 3-3 5-2 1-1 3-1 5 2 3-2 6-1 9 3-4-1-6 0-8 2-1-1-3-2-4-1-1-1-3 0-4 1-2-2-4-3-8-2z" opacity="0.65"/>
  </g>

  <!-- тыква -->
  <g class="float" style="animation-delay:-2s" filter="url(#shadow)">
    <path d="M876 128c-2-18 6-30 20-36" stroke="#1E293B" stroke-width="9" stroke-linecap="round"/>
    <path d="M896 98c14-10 30-8 38 2-14 4-26 4-38-2z" fill="#38BDF8"/>
    <ellipse cx="826" cy="196" rx="58" ry="68" fill="url(#pumpkin)"/>
    <ellipse cx="926" cy="196" rx="58" ry="68" fill="url(#pumpkin)"/>
    <ellipse cx="876" cy="196" rx="62" ry="72" fill="url(#pumpkin)"/>
    <path d="M876 126v140M836 134c-10 30-10 94 0 124M916 134c10 30 10 94 0 124" stroke="#E25E00" stroke-opacity="0.35" stroke-width="3"/>
    <path d="M836 178l18-22 18 22z M880 178l18-22 18 22z" fill="#1E293B"/>
    <path d="M832 212c10 22 78 22 88 0l-12 8-10-10-10 12-12-12-10 12-10-10-12 8z" fill="#1E293B"/>
  </g>
</svg>
