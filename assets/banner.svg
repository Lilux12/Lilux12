<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Tema (Lilux) — developer and maker</title>
  <desc id="bannerDesc">Dark terminal-style banner with orange accents: Tema // Lilux, 12 years old, Russia, coding since 10.</desc>

  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#FFD9A8"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF8C00" stop-opacity="0"/>
      <stop offset="35%" stop-color="#FF8C00" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#FFB347" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF8C00" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#1A1A21" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <style>
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .sparkle { animation: twinkle 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .glow { animation: breathe 7s ease-in-out infinite; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes twinkle { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.1); } }
      @keyframes breathe { 0%, 100% { opacity: .06; } 50% { opacity: .13; } }
    </style>
  </defs>

  <rect width="1200" height="320" fill="#0A0A0D"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.55"/>

  <ellipse class="glow" cx="130" cy="10" rx="340" ry="230" fill="#FF8C00" filter="url(#bigBlur)"/>
  <ellipse class="glow" cx="1090" cy="330" rx="360" ry="240" fill="#FF5E00" filter="url(#bigBlur)"/>
  <rect width="1200" height="320" fill="url(#vignette)"/>

  <!-- left accent -->
  <rect x="56" y="72" width="2" height="176" fill="#FF8C00" opacity="0.55"/>

  <!-- labels -->
  <text x="80" y="82" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="4" fill="#8B949E">// DEVELOPER · MAKER · BUILDER</text>

  <!-- name -->
  <text x="74" y="182" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="92" font-weight="800" letter-spacing="2" fill="url(#titleGrad)" filter="url(#softGlow)">TEMA</text>
  <text x="322" y="178" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="23" font-weight="600" letter-spacing="3" fill="#FF8C00">// LILUX</text>

  <text x="80" y="218" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#C9D1D9">12 y.o. · Россия · в коде с 10 лет</text>

  <!-- sparkles -->
  <path class="sparkle" d="M556 84 l7 20 20 7 -20 7 -7 20 -7 -20 -20 -7 20 -7 z" fill="#FF8C00" opacity="0.85"/>
  <path class="sparkle" d="M606 60 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 z" fill="#FFB347" opacity="0.6" style="animation-delay: 1.2s"/>

  <!-- terminal card -->
  <g>
    <rect x="680" y="50" width="440" height="220" rx="14" fill="#101015" stroke="#2A2A33"/>
    <path d="M680 86H1120" stroke="#2A2A33"/>
    <circle cx="704" cy="68" r="5" fill="#FF5F56"/>
    <circle cx="722" cy="68" r="5" fill="#FFBD2E"/>
    <circle cx="740" cy="68" r="5" fill="#27C93F"/>
    <text x="1098" y="73" text-anchor="end" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="2" fill="#6E7681">bash</text>

    <text x="700" y="116" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#FF8C00">$ <tspan fill="#E6EDF3">whoami</tspan></text>
    <text x="700" y="140" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#C9D1D9">Tema — developer &amp; maker</text>

    <text x="700" y="168" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#FF8C00">$ <tspan fill="#E6EDF3">cat stack.txt</tspan></text>
    <text x="700" y="192" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#C9D1D9">C/C++ · Python · Java · JS</text>

    <text x="700" y="220" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#FF8C00">$ <tspan fill="#E6EDF3">uptime</tspan></text>
    <text x="700" y="244" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#C9D1D9">coding since ~10 y.o.</text>
    <rect class="cursor" x="888" y="232" width="8" height="15" fill="#FF8C00"/>
  </g>

  <rect x="0" y="317" width="1200" height="3" fill="url(#lineGrad)"/>
</svg>
