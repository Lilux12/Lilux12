name: Snake

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Lilux12
          outputs: |
            dist/github-snake.svg?color_snake=%23FF7A1A&color_dots=%23EEF2F7,%23BAE6FD,%237DD3FC,%2338BDF8,%230284C7
            dist/github-snake-dark.svg?color_snake=%23FF7A1A&color_dots=%231A1828,%230C4A6E,%230369A1,%230EA5E9,%2338BDF8

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
